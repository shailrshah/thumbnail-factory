name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `build` runs `tsc -b` first, so type errors fail here.
      - run: npm run build

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yml
          targets: backend,frontend,gateway
          load: true
          # One cache scope per image; a shared scope would have each build overwrite the others.
          # mode=max also caches builder stages, where the slow dependency installs happen.
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,scope=backend,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
            gateway.cache-from=type=gha,scope=gateway
            gateway.cache-to=type=gha,scope=gateway,mode=max
      # ECR Public allows 1 unauthenticated pull/s per IP (not adjustable), and hosted runners
      # share IPs, so pulls can hit "toomanyrequests" from other people's jobs. Retry with backoff.
      - name: Pull Redis
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose -f compose.yml pull redis && exit 0
            echo "Pull failed (attempt $attempt); retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          exit 1
      - name: Start stack
        run: docker compose -f compose.yml up -d --wait --wait-timeout 120 --no-build
      - name: Smoke test
        run: scripts/smoke_test.sh
      - name: Dump state on failure
        if: failure()
        run: |
          docker compose -f compose.yml ps -a
          docker compose -f compose.yml logs --no-color
