[project]
name = "thumbnail-factory-infra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.271.0",
    "constructs>=10.8.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
