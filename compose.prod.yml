# EC2 deployment: runs images from ECR by tag; never builds. Written to the instance by the deploy
# workflow along with an .env holding ECR_REGISTRY and IMAGE_TAG (see scripts/deploy_remote.sh).
# Standalone rather than an overlay of compose.yml, so the instance needs only this one file.

x-backend: &backend
  image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/thumbnail-factory/backend:${IMAGE_TAG:?IMAGE_TAG is required}
  restart: unless-stopped
  environment:
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /data
    MAX_UPLOAD_MB: "10"
    WORKER_DELAY_SECONDS: "2"
    THUMBNAIL_WIDTHS: 128,256,512
  volumes:
    - media:/data
  depends_on:
    redis:
      condition: service_healthy

x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 10s
  start_interval: 1s

services:
  gateway:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/thumbnail-factory/gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      FRONTEND_UPSTREAM: frontend:8080
    volumes:
      - media:/data:ro
    networks: [public]
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  frontend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/thumbnail-factory/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    networks: [public]

  backend:
    <<: *backend
    networks: [public, internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      <<: *healthcheck-timing

  worker:
    <<: *backend
    command: ["rq", "worker", "thumbnails", "--url", "redis://redis:6379/0"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      <<: *healthcheck-timing

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-timing

networks:
  public:
  internal:
    internal: true

volumes:
  media:
  redis-data:
