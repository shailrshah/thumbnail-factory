x-backend: &backend
  build: ./backend
  restart: unless-stopped
  image: thumbnail-factory/backend
  environment:
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    MEDIA_ROOT: /data
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    WORKER_DELAY_SECONDS: ${WORKER_DELAY_SECONDS:-2}
    THUMBNAIL_WIDTHS: ${THUMBNAIL_WIDTHS:-128,256,512}
  volumes:
    - media:/data
  depends_on:
    redis:
      condition: service_healthy

x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 10s
  # Probe every second during start_period so dependents aren't held up by the 10s interval.
  start_interval: 1s

services:
  gateway:
    restart: unless-stopped
    build: ./gateway
    image: thumbnail-factory/gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-frontend:8080}
    volumes:
      - media:/data:ro
    networks: [public]
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      target: runtime
    image: thumbnail-factory/frontend
    networks: [public]

  backend:
    <<: *backend
    # The only service on both networks: the sole path from the public tier to Redis.
    networks: [public, internal]
    healthcheck:
      # /api/health pings Redis, so healthy means the whole API path works. Python instead of
      # curl/wget so the check doesn't depend on which tools the base image ships.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      <<: *healthcheck-timing

  worker:
    <<: *backend
    command: ["rq", "worker", "thumbnails", "--url", "${REDIS_URL:-redis://redis:6379/0}"]
    networks: [internal]
    healthcheck:
      # Healthy when this container's RQ worker is registered in Redis and its process is alive.
      test: ["CMD", "python", "-m", "app.worker_health"]
      <<: *healthcheck-timing

  redis:
    restart: unless-stopped
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-timing

networks:
  public:
  internal:
    # No route out of Docker: Redis and the worker never need the internet.
    internal: true

volumes:
  media:
  redis-data:
